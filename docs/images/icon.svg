<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 360" width="256" height="256" role="img" aria-label="Awesome Catalunya">
  <!-- The favicon: logo.svg (one panot tile from banner.svg) on a rounded plate
