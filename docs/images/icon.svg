    <radialGradient id="aw-lamp" cx="180" cy="180" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f0b46a" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#0a0a0f" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a0a0f" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="aw-tile-icon"><rect width="46" height="46"/></clipPath>
  </defs>
  <rect width="360" height="360" rx="72" fill="#0a0a0f"/>
  <rect width="360" height="360" rx="72" fill="url(#aw-lamp)"/>
